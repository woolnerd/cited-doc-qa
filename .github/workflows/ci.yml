name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff linter
        run: ruff check backend/app tests

      - name: Check Black formatting
        run: black --check backend/app tests

      - name: Run Mypy type checking
        run: mypy backend/app
        continue-on-error: true  # Don't fail build on type errors initially

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short
        continue-on-error: true  # Allow tests to fail initially during setup

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v -m integration --tb=short
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/unit/ -m "not slow" --ignore=tests/unit/test_vector_search.py --ignore=tests/unit/test_full_text_search.py --ignore=tests/unit/test_hybrid_search.py --ignore=tests/unit/test_query_api.py --cov=backend/app --cov-report=xml --cov-report=term --cov-fail-under=60
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false  # Don't fail if codecov upload fails
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run Bandit security scan
        run: bandit -c pyproject.toml -r backend/app
        continue-on-error: true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: production-rag-system:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker image
        run: |
          # Start container in background
          docker run -d --name test-container \
            -p 8000:8000 \
            -e SUPABASE_URL=http://test \
            -e SUPABASE_KEY=test \
            -e GEMINI_API_KEY=test \
            -e COHERE_API_KEY=test \
            -e OPENROUTER_API_KEY=test \
            production-rag-system:latest

          # Wait for application to start
          echo "Waiting for application to start..."
          sleep 5

          # Test health endpoint directly
          echo "Testing health endpoint..."
          for i in {1..20}; do
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Health endpoint is responding"

              # Verify container is still running
              if docker ps | grep -q test-container; then
                echo "✅ Container is running"
                docker logs test-container | tail -20
                docker stop test-container
                docker rm test-container
                exit 0
              else
                echo "❌ Container stopped unexpectedly"
                docker logs test-container
                docker rm test-container
                exit 1
              fi
            fi
            echo "Attempt $i: Health endpoint not ready yet, waiting..."
            sleep 2
          done

          echo "❌ Health endpoint failed to respond"
          echo "Container logs:"
          docker logs test-container
          docker stop test-container
          docker rm test-container
          exit 1

      - name: Check image size
        run: |
          SIZE=$(docker image inspect production-rag-system:latest --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "Image size: ${SIZE}MB"
          if [ $SIZE -gt 500 ]; then
            echo "⚠️ Warning: Image size (${SIZE}MB) exceeds 500MB target"
          else
            echo "✅ Image size is within 500MB target"
          fi

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, test-coverage, security-scan]
    if: always()

    steps:
      - name: Check if all jobs succeeded
        run: |
          echo "Lint and format: ${{ needs.lint-and-format.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Coverage: ${{ needs.test-coverage.result }}"
          echo "Security: ${{ needs.security-scan.result }}"

          if [[ "${{ needs.lint-and-format.result }}" == "success" ]] && \
             [[ "${{ needs.test.result }}" == "success" || "${{ needs.test.result }}" == "skipped" ]]; then
            echo "✅ CI checks passed!"
            exit 0
          else
            echo "⚠️ Some CI checks failed or were skipped"
            exit 0  # Don't fail during initial setup
          fi
