name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual deployment

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate deployment summary
        run: |
          echo "## 🚀 Docker Image Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-to-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    # Only run if VPS secrets are configured
    if: vars.VPS_CONFIGURED == 'true'
    environment:
      name: production
      url: ${{ vars.DEPLOYMENT_URL || 'https://rag.getfreetime.ai' }}

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/production-rag-system

            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "🐳 Pulling latest Docker image..."
            docker-compose -f docker-compose.prod.yml pull

            echo "🛑 Stopping old containers..."
            docker-compose -f docker-compose.prod.yml down

            echo "🚀 Starting new containers..."
            docker-compose -f docker-compose.prod.yml up -d

            echo "⏳ Waiting for application to start..."

            # Wait up to 60 seconds for health check to pass
            for i in {1..12}; do
              echo "Attempt $i/12: Checking health endpoint..."
              if curl -f http://localhost:8001/health > /dev/null 2>&1; then
                echo "✅ Deployment successful - health check passed"
                break
              fi

              if [ $i -eq 12 ]; then
                echo "❌ Deployment failed - health check timed out after 60 seconds"
                docker-compose -f docker-compose.prod.yml logs --tail=50
                exit 1
              fi

              echo "Not ready yet, waiting 5 seconds..."
              sleep 5
            done

            echo "🧹 Cleaning up old images..."
            docker image prune -f

      - name: Run smoke tests
        run: |
          DEPLOYMENT_URL="${{ vars.DEPLOYMENT_URL || 'https://rag.getfreetima.ai' }}"

          echo "🧪 Running smoke tests..."

          # Test health endpoint
          if curl -f ${DEPLOYMENT_URL}/health > /dev/null 2>&1; then
            echo "✅ Health endpoint responding"
          else
            echo "❌ Health endpoint not responding"
            exit 1
          fi

          # Test API docs
          if curl -f ${DEPLOYMENT_URL}/docs > /dev/null 2>&1; then
            echo "✅ API docs accessible"
          else
            echo "⚠️ API docs not accessible (non-critical)"
          fi

          echo "✅ All smoke tests passed"

      - name: Deployment summary
        if: success()
        run: |
          echo "## 🌐 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** production" >> $GITHUB_STEP_SUMMARY
          echo "**Host:** \`${{ secrets.VPS_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ vars.DEPLOYMENT_URL || 'https://rag.getfreetime.ai' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-vps]
    if: failure() && vars.VPS_CONFIGURED == 'true'

    steps:
      - name: Rollback to previous version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/production-rag-system

            echo "🔄 Rolling back to previous version..."

            # Get previous image tag
            PREV_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep production-rag-system | sed -n '2p')

            if [ -n "$PREV_IMAGE" ]; then
              echo "Rolling back to: $PREV_IMAGE"

              # Update docker-compose to use previous image
              export IMAGE_TAG=$PREV_IMAGE
              docker-compose -f docker-compose.prod.yml down
              docker-compose -f docker-compose.prod.yml up -d

              # Verify rollback
              sleep 10
              if curl -f http://localhost:8001/health > /dev/null 2>&1; then
                echo "✅ Rollback successful"
              else
                echo "❌ Rollback failed"
                exit 1
              fi
            else
              echo "⚠️ No previous image found for rollback"
            fi

      - name: Notify rollback
        run: |
          echo "## ⚠️ Deployment Failed - Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment failed and has been automatically rolled back." >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs and fix the issue before redeploying." >> $GITHUB_STEP_SUMMARY
