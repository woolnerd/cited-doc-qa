services:
  app:
    image: ${DOCKER_REGISTRY:-ghcr.io/woolnerd}/cited-doc-qa:${IMAGE_TAG:-latest}
    container_name: rag-chatbot-prod
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=WARNING
    env_file:
      - .env.production
    volumes:
      # GCS service-account key for signed source-document URLs
      # (set GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/rag-demo-gcs-viewer.json)
      - ${GCS_CREDENTIALS_FILE:-/root/secrets/rag-demo-gcs-viewer.json}:/run/secrets/rag-demo-gcs-viewer.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - rag-network
      - n8n-test_default
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  rag-network:
    driver: bridge
  n8n-test_default:
    external: true
